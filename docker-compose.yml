services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-product_catalog}
    volumes:
      - product_catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      target: api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-product_catalog}
      CATALOG_JSON_PATH: /data/catalog.json
      IMAGES_DIR: /data/images
      APP_NAME: ${APP_NAME:-Product Catalog API}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-REST API for the Product Catalog}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      LOCAL_WEB_APP_URL: ${LOCAL_WEB_APP_URL:-http://localhost:3000}
      LIVE_WEB_APP_URL: ${LIVE_WEB_APP_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m seed && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  product_catalog_db_data:
